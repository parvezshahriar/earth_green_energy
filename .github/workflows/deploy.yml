name: Deploy EarthGreenEnergy to Vercel

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  lint:
    name: Validate PHP Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: PHP Syntax Check (Linting)
        run: |
          find . -name "*.php" ! -path "./vendor/*" -exec php -l {} \;

  deploy:
    name: Deploy to Vercel
    needs: lint
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Project Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.vcp_5pLBIr8park6Ho72uPgYXVLOyjxSAPqSxfN9cTR5ItsOwuGRv74I49S3 }}
          VERCEL_ORG_ID: ${{ secrets.team_3j3slYknG4Zox8blwHX3fnxz }}
          VERCEL_PROJECT_ID: ${{ secrets.prj_36zORhZBJby4FgsbGFE3LP9Ihal0 }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.vcp_5pLBIr8park6Ho72uPgYXVLOyjxSAPqSxfN9cTR5ItsOwuGRv74I49S3 }}
          VERCEL_ORG_ID: ${{ secrets.team_3j3slYknG4Zox8blwHX3fnxz }}
          VERCEL_PROJECT_ID: ${{ secrets.prj_36zORhZBJby4FgsbGFE3LP9Ihal0 }}

      - name: Deploy Artifacts to Vercel Production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.vcp_5pLBIr8park6Ho72uPgYXVLOyjxSAPqSxfN9cTR5ItsOwuGRv74I49S3 }}
          VERCEL_ORG_ID: ${{ secrets.team_3j3slYknG4Zox8blwHX3fnxz }}
          VERCEL_PROJECT_ID: ${{ secrets.prj_36zORhZBJby4FgsbGFE3LP9Ihal0 }}
